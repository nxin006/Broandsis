<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Long-Distance Bro & Sis Chaos 😂</title>
<style>
:root{color-scheme:dark;--bg:#100b19;--card:#211829;--ink:#fff3ff;--muted:#c5b2ce;--pink:#ff3fa4;--purple:#8757ff;--line:#52314f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
#app{min-height:100vh;background:var(--bg);padding:24px 15px 38px;overflow:hidden;background-image:radial-gradient(ellipse at 8% 8%,#63204d 0,transparent 34%),radial-gradient(ellipse at 95% 90%,#302060 0,transparent 36%),linear-gradient(145deg,#120c19,#1b1024 55%,#100b19)}
.wrap{max-width:560px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(11px,3vw,14px);color:#e6c7e3;font-weight:850;letter-spacing:.035em;gap:8px}.top-right{display:flex;align-items:center;gap:8px}.dots{border:0;background:transparent;color:inherit;font-size:28px;padding:0 8px;cursor:pointer}.popup{position:fixed;inset:0;background:#090510d9;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.popup-panel{width:min(100%,420px);padding:24px;border-radius:24px;background:linear-gradient(140deg,#512346,#302252);color:white;box-shadow:0 20px 70px #0008}.admin-page{position:fixed;inset:0;z-index:120;overflow:auto;background:radial-gradient(ellipse at top left,#62204e,transparent 45%),linear-gradient(145deg,#100b19,#211431);padding:20px 14px 36px;color:#fff}.admin-shell{max-width:1000px;margin:0 auto}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:#170f22ed;backdrop-filter:blur(12px);padding:12px;border:1px solid #68415f;border-radius:18px;z-index:2}.admin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.admin-stat{background:#281b35;border:1px solid #68415f;border-radius:16px;padding:14px}.admin-stat strong{display:block;font-size:24px;color:#ff7ac5}.activity-list{display:grid;gap:10px}.activity-item{background:#25192f;border:1px solid #563650;border-radius:14px;padding:12px;overflow-wrap:anywhere}.activity-meta{font-size:12px;color:#d3b6d4;margin-bottom:7px}.activity-action{font-weight:850;color:#ff8bc9;margin-bottom:5px}.admin-notice{padding:14px;border-radius:14px;background:#38253f;color:#ead9ee;line-height:1.5;margin:14px 0}@media(max-width:520px){.admin-stats{grid-template-columns:1fr 1fr}.admin-head h2{font-size:18px}}.popup-panel input{width:100%;padding:13px;border-radius:12px;border:1px solid #b88bb5;background:#21162c;color:white;font:inherit;margin:8px 0 12px}.close-popup{float:right;background:transparent;border:0;color:white;font-size:24px}.final-screen{position:fixed;inset:0;z-index:80;overflow:auto;background:radial-gradient(circle at 15% 20%,#ff2a9d 0,transparent 35%),radial-gradient(circle at 85% 75%,#653dff 0,transparent 40%),#100b1b;color:white;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}.final-inner{max-width:600px;width:100%}.infinity{font-size:clamp(58px,16vw,110px);font-weight:1000;line-height:1;background:linear-gradient(90deg,#ff4fa3,#a88bff,#fff);color:transparent;background-clip:text}.blast-screen{animation:blastbg .45s ease-out 2}@keyframes blastbg{0%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(3);transform:scale(1.025)}100%{filter:brightness(1);transform:scale(1)}}.badge{background:linear-gradient(120deg,#54213f,#38204f);border:1px solid #75436d;padding:9px 13px;border-radius:999px;color:#ffc9e8;white-space:nowrap;box-shadow:0 5px 22px #0002}
.progress{height:9px;background:#39243a;border:1px solid #4b304d;border-radius:99px;overflow:hidden;margin:19px 0 24px}.bar{height:100%;width:10%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:99px;transition:width .3s}
.card{background:linear-gradient(155deg,rgba(42,29,47,.96),rgba(30,22,39,.94));border:1px solid rgba(255,155,220,.18);border-radius:30px;padding:clamp(22px,6vw,36px) clamp(19px,5vw,32px);box-shadow:0 22px 65px #0003,inset 0 1px 0 #ffffff0b;min-height:clamp(480px,70vh,680px);position:relative;overflow:hidden;backdrop-filter:blur(18px)}.card:before{content:"";position:absolute;top:-100px;right:-95px;width:210px;height:210px;border-radius:50%;background:#d72e9a16;filter:blur(8px);pointer-events:none}.card>*{position:relative;z-index:1}.emoji{font-size:54px;margin-bottom:16px;filter:drop-shadow(0 7px 18px #ff3fa433)}.eyebrow{text-transform:uppercase;color:#ff5eb5;font-size:clamp(10px,2.8vw,12px);letter-spacing:.15em;font-weight:950}.question{font-size:clamp(27px,6.7vw,37px);line-height:1.13;letter-spacing:-.045em;margin:12px 0 16px;text-wrap:balance}.sub{color:#c8b5ce;line-height:1.58;font-size:clamp(15px,4.2vw,18px);margin:0 0 25px}.options{display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:100px;position:relative}.btn{font:inherit;font-weight:850;border:0;border-radius:17px;padding:15px 17px;cursor:pointer;transition:transform .18s,opacity .18s,filter .18s,box-shadow .18s;touch-action:manipulation}.btn:active{transform:scale(.97)}.primary{background:linear-gradient(110deg,#ff319f 0%,#bd3fe4 54%,#8057ff 100%);color:white;box-shadow:0 9px 26px #c52da744,inset 0 1px 0 #ffffff55}.primary:hover{filter:brightness(1.08);box-shadow:0 12px 30px #c52da755}.secondary{background:linear-gradient(145deg,#3b293f,#2b2034);color:#ffe0f3;border:1px solid #68415f;box-shadow:inset 0 1px 0 #ffffff0a}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}.arena{height:0;position:static;background:transparent;border:0;overflow:visible;margin:0}.arena .btn{position:fixed;z-index:20;min-width:115px;max-width:45vw;box-shadow:0 8px 24px #7b3b7126}.feedback{margin-top:15px;font-weight:800;color:#8d3280;min-height:24px}.answer-result{margin-top:14px;padding:0;border:0;border-radius:0;background:transparent;color:#ffd1ee;text-align:center;font-size:clamp(15px,4vw,18px);font-weight:800;line-height:1.45;box-shadow:none;animation:popresult .28s ease-out;text-wrap:pretty}.next-wrap{display:flex;justify-content:center;margin-top:16px}.next-btn{font-size:18px;padding:16px 26px;min-width:190px;box-shadow:0 8px 22px #8057ff35}@keyframes popresult{from{transform:scale(.86);opacity:.3}to{transform:scale(1);opacity:1}}@media(max-width:420px){.card{border-radius:26px;padding:24px 20px;min-height:0}.options{gap:10px}.btn{max-width:100%}.next-btn{min-width:0;width:100%}}.tiny{font-size:12px;color:var(--muted)}.meter{height:14px;border-radius:99px;background:#f1e4f2;overflow:hidden;margin:15px 0}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8bba,#8057ff);transition:width .15s}.slider{width:100%;accent-color:var(--pink)}.center{text-align:center}.bigscore{font-size:64px;font-weight:950;letter-spacing:-.06em;background:linear-gradient(90deg,var(--pink),var(--purple));color:transparent;background-clip:text}.hidden{display:none!important}.float{position:fixed;pointer-events:none;animation:rise 2s ease-out forwards;font-size:22px;z-index:10}@keyframes rise{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(-180px) rotate(35deg);opacity:0}}

@keyframes blast{0%{transform:scale(1);opacity:1}100%{transform:scale(2.5);opacity:0}}
</style>
</head>
<body><main id="app"><div class="wrap">
<div class="top"><span>💗 BRO & SIS: DISTANCE TEST</span><div class="top-right"><span class="badge" id="counter">QUESTION 1 / 6</span><button class="dots" id="menuBtn" aria-label="More options">⋮</button></div></div><div class="progress"><div class="bar" id="progress"></div></div>
<section class="card" id="card"></section><p class="note">⚠️ Made with long-distance sibling love, teasing, and fake science. 💗</p>
</div></main>
<script>
const card=document.getElementById('card'),counter=document.getElementById('counter'),progress=document.getElementById('progress');
let q=0,holdTimer=null,hold=0,audioCtx=null;
// Activity is kept on this device only. No hidden uploads or screen recording.
const sessionId = 'SIS-' + Math.random().toString(36).slice(2,8).toUpperCase();
const activity = JSON.parse(localStorage.getItem('broSisActivity') || '[]');
function logActivity(action, detail='') {
  activity.push({time:new Date().toLocaleString(), session:sessionId, question:q+1, action, detail});
  try { localStorage.setItem('broSisActivity', JSON.stringify(activity.slice(-500))); } catch(e) {}
}
document.getElementById('menuBtn').addEventListener('click',()=>showBrotherMenu());
function showBrotherMenu(){
 const overlay=document.createElement('div'); overlay.className='popup';
 overlay.innerHTML='<div class="popup-panel"><button class="close-popup" aria-label="Close">×</button><h2>brother -</h2><p>Type here</p><input id="broPass" type="text" autocomplete="off" placeholder="Type here"><button class="btn primary" id="passGo">Continue</button><p class="tiny" id="passMsg"></p></div>';
 document.body.append(overlay); overlay.querySelector('.close-popup').onclick=()=>overlay.remove();
 overlay.querySelector('#passGo').onclick=()=>{
   if(overlay.querySelector('#broPass').value.trim().toLowerCase()==='wnd'){
     overlay.querySelector('.popup-panel').innerHTML='<button class="close-popup">×</button><h2>brother -</h2><p>Type here</p><input id="broCmd" autocomplete="off" placeholder="Type here"><button class="btn primary" id="cmdGo">Continue</button><p class="tiny" id="cmdMsg"></p>';
     overlay.querySelector('.close-popup').onclick=()=>overlay.remove();
     overlay.querySelector('#cmdGo').onclick=()=>{
       if(overlay.querySelector('#broCmd').value.trim().toLowerCase()==='nxin'){
         const items=activity.slice().reverse().map(x=>`<article class="activity-item"><div class="activity-meta">${escapeHtml(x.time)} · ${escapeHtml(x.session)} · Question ${x.question}</div><div class="activity-action">${escapeHtml(x.action)}</div><div>${escapeHtml(x.detail||'—')}</div></article>`).join('');
         overlay.remove();
         const admin=document.createElement('section'); admin.className='admin-page'; admin.id='adminPage';
         admin.innerHTML=`<div class="admin-shell"><header class="admin-head"><div><div class="eyebrow">BRO & SIS · PRIVATE DASHBOARD</div><h2 style="margin:6px 0 0">Brother — Activity Log</h2></div><button class="btn secondary" id="closeAdmin">✕ Close</button></header><div class="admin-stats"><div class="admin-stat"><span class="tiny">Logged events</span><strong>${activity.length}</strong></div><div class="admin-stat"><span class="tiny">Local session</span><strong style="font-size:15px">${sessionId}</strong></div><div class="admin-stat"><span class="tiny">Questions</span><strong>6</strong></div></div><div class="admin-notice"><b>Connection status: This device only.</b><br>This is a separate, clearer dashboard page. It lists question views, taps, chosen options, and timestamps. Typed text answers are not stored. To view activity from another person’s phone in a different location, the quiz needs an online backend/database and both users must be told what activity is shared. This offline HTML cannot transmit logs remotely.</div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0"><h3 style="margin:0">Recent activity</h3><button class="btn secondary" id="clearLog">Clear log</button></div><div class="activity-list">${items||'<div class="activity-item">No activity yet. Start the quiz to see events here.</div>'}</div><p class="tiny" style="margin-top:18px">Session data is stored locally in this browser only.</p></div>`;
         document.body.append(admin);
         admin.querySelector('#closeAdmin').onclick=()=>admin.remove();
         admin.querySelector('#clearLog').onclick=()=>{activity.length=0;localStorage.removeItem('broSisActivity');admin.remove();showBrotherMenu()};
       } else overlay.querySelector('#cmdMsg').textContent='Try again.';
     };
   } else overlay.querySelector('#passMsg').textContent='Try again.';
 };
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const questions=[
 {emoji:'💖',tag:'Question 1 · The obvious truth',title:'Who is the cutest and smartest?',sub:'Choose wisely. The screen has its own favourite 😌',type:'cute'},
 {emoji:'📱',tag:'Question 2 · Reply department',title:'Who disappears after saying, “I’ll reply in 2 minutes”?',sub:'If you choose yourself, prepare for consequences. 😈',type:'vanish'},
 {emoji:'💗',tag:'Question 3 · Online happiness detector',title:'Who secretly gets happy when the other person comes online?',sub:'One answer is correct. The other one gets a dramatic sound effect. 😂',type:'online'},
 {emoji:'🫶',tag:'Question 4 · Pasam analysis',title:'Who has more paasam (love and affection) for the other?',sub:'Press and HOLD to analyse the long-distance sibling bond…',type:'pasam'},
 {emoji:'🎁',tag:'Question 5 · Secret file',title:'What is your brother’s favourite thing?',sub:'Write your answer below. (Don’t type your name 😭)',type:'favourite'},
 {emoji:'🫆',tag:'Question 6 · Ego fingerprint scan',title:'Who has more vanmam or ego?',sub:'Place and hold your finger on the scanner to analyse both records.',type:'fingerprint'}
];
function btn(text,cls,fn){const b=document.createElement('button');b.className='btn '+(cls||'secondary');b.textContent=text;b.addEventListener('click',()=>{logActivity('Option tapped',text);fn()});return b}
function sound(kind='pop') { try { audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); const now=audioCtx.currentTime; const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(); osc.connect(gain);gain.connect(audioCtx.destination); osc.type=kind==='blast'?'sawtooth':'sine'; osc.frequency.setValueAtTime(kind==='blast'?180:kind==='win'?660:420,now); if(kind==='blast'){osc.frequency.exponentialRampToValueAtTime(45,now+.38);gain.gain.setValueAtTime(.32,now);gain.gain.exponentialRampToValueAtTime(.001,now+.4);osc.start(now);osc.stop(now+.4)}else{osc.frequency.exponentialRampToValueAtTime(kind==='win'?990:260,now+.14);gain.gain.setValueAtTime(.16,now);gain.gain.exponentialRampToValueAtTime(.001,now+.16);osc.start(now);osc.stop(now+.16)} }catch(e){} }
function layout(){clearInterval(holdTimer);logActivity('Question shown',questions[q]?.title||'');counter.textContent=`QUESTION ${q+1} / 6`;progress.style.width=((q+1)/6*100)+'%';const d=questions[q];card.innerHTML=`<div class="emoji">${d.emoji}</div><div class="eyebrow">${d.tag}</div><h1 class="question">${d.title}</h1><p class="sub">${d.sub}</p><div id="stage"></div><div class="feedback" id="feedback" aria-live="polite"></div>`;const s=document.getElementById('stage');({cute,vanish,online,pasam,favourite,fingerprint}[d.type])(s)}
function next(msg){clearInterval(holdTimer);sound('win');const stage=document.getElementById('stage');if(!stage)return;let box=stage.querySelector('.answer-result');if(!box){box=document.createElement('div');box.className='answer-result';stage.appendChild(box)}box.textContent=msg;let wrap=stage.querySelector('.next-wrap');if(!wrap){wrap=document.createElement('div');wrap.className='next-wrap';const n=btn(q===questions.length-1?'SEE FINAL REPORT 🏆':'NEXT QUESTION ➜','primary next-btn',()=>{q++;if(q<questions.length)layout();else result()});wrap.appendChild(n);stage.appendChild(wrap)}}
function moveAnywhere(b){const pad=10;const maxX=Math.max(pad,innerWidth-b.offsetWidth-pad),maxY=Math.max(pad,innerHeight-b.offsetHeight-pad);b.style.position='fixed';b.style.zIndex='30';b.style.left=(pad+Math.random()*(maxX-pad))+'px';b.style.top=(pad+Math.random()*(maxY-pad))+'px'}
function cute(s){const bro=btn('MY BROTHER 😎','primary',()=>next('CORRECT! YOUR BROTHER IS THE CUTEST & SMARTEST. 👑💖'));const me=btn('ONLY ME 💅','secondary',()=>{sound();moveAnywhere(me);next('NICE TRY! 😂 The “ONLY ME” option ran away… your brother still claims the crown. 👑');});s.append(bro,me);}
function vanish(s){let size=1;const bro=btn('MY BROTHER 😎','primary',()=>{sound();size*=.68;bro.style.transform=`scale(${size})`;bro.style.transformOrigin='center';if(size<.38)bro.textContent='🤏';if(size<.12){bro.style.opacity='0.08';bro.style.pointerEvents='none';document.getElementById('feedback').textContent='BROTHER HAS VANISHED… replying in 2 minutes, apparently. 💨';setTimeout(()=>next('Case closed: brother’s reply speed has disappeared. 😂'),700)}else{document.getElementById('feedback').textContent='The “MY BROTHER” option is shrinking… click again if you dare 👀'}});const me=btn('ME 🙋‍♀️','secondary',()=>next('FINALLY, THE TRUTH REVEALED! 😂📱 Two-minute replies have officially been exposed. Case closed! 💥'));s.append(bro,me)}
function online(s){const bro=btn('MY BROTHER 💗','primary',()=>next('CORRECT! Brother gets secretly happy when sis comes online. 🥹💖'));const me=btn('ME 😇','secondary',()=>{sound('blast');me.remove();const boom=document.createElement('div');boom.style.cssText='font-size:58px;text-align:center;animation:rise .7s ease-out';boom.textContent='💥💣💥';s.append(boom);document.getElementById('feedback').textContent='';setTimeout(()=>{if(boom.isConnected)boom.remove();next('BOOOOM! 😂 The “ME” option got blasted for fake confidence. Brother secretly wins this one! 💗')},650)});s.append(bro,me)}
function pasam(s){const label=document.createElement('p');label.innerHTML='<b id="scanlabel">Waiting for emotional evidence…</b>';const meter=document.createElement('div');meter.className='meter';meter.innerHTML='<span></span>';const b=btn('💗 HOLD TO ANALYSE PASAM','primary');const hint=document.createElement('p');hint.className='tiny';hint.textContent='Keep holding for 3 seconds…';s.append(label,meter,b,hint);let progress=0;const start=e=>{e.preventDefault();if(holdTimer)return;progress=0;holdTimer=setInterval(()=>{progress+=3.4;meter.firstChild.style.width=Math.min(100,progress)+'%';label.firstChild.textContent=progress<35?'Scanning chats and check-ins…':progress<70?'Measuring care across the distance…':'Calculating paasam levels…';if(progress>=100){clearInterval(holdTimer);holdTimer=null;b.disabled=true;sound('win');label.innerHTML='<span style="font-size:22px">ANALYSIS COMPLETE 💗</span>';hint.textContent='Results are scientifically emotional.';setTimeout(()=>next('FINAL RESULT: YOUR BROTHER HAS MORE PAASAM! 💖🫶'),900)}},100)};const stop=()=>{if(holdTimer&&progress<100){clearInterval(holdTimer);holdTimer=null;progress=0;meter.firstChild.style.width='0%';label.textContent='Scan interrupted! Hold the button properly 😭'}};b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointerleave',stop);b.addEventListener('contextmenu',e=>e.preventDefault())}
function favourite(s){const input=document.createElement('textarea');input.placeholder='Type your answer here…';input.rows=3;input.style.cssText='width:100%;padding:14px;border-radius:13px;border:1px solid #e7c8df;background:transparent;color:inherit;font:inherit;margin-bottom:12px;resize:vertical';const send=btn('SAVE THE SECRET 💌','primary',()=>{if(!input.value.trim()){input.placeholder='Psst… write something first 😭';return}const answer=input.value.trim();logActivity('Answer submitted','Favourite-thing answer submitted (content not stored)');s.innerHTML=`<div class="center"><div class="emoji">🤐</div><h2>SECRET SAVED!</h2><p class="sub">Your answer: <b></b></p><p class="tiny">Brother’s secret file is now safely locked. 🔐</p></div>`;s.querySelector('b').textContent=answer;sound('win');setTimeout(()=>next('Secret recorded. And yes, we specifically said: don’t type your name. 😂'),1400)});s.append(input,send)}
function fingerprint(s){const pad=document.createElement('div');pad.style.cssText='height:150px;border:2px dashed #d8a5cf;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff4fb;touch-action:none;color:#733b67';pad.innerHTML='<div id="finger" style="font-size:54px">🫆</div><b id="fingertext">HOLD FINGER HERE</b>';const meter=document.createElement('div');meter.className='meter';meter.innerHTML='<span></span>';const status=document.createElement('p');status.className='tiny';status.textContent='Scanning fingerprint records…';s.append(pad,meter,status);let pct=0,active=false;const begin=e=>{e.preventDefault();if(active)return;active=true;pct=0;pad.style.background='#f6dcf2';holdTimer=setInterval(()=>{pct+=4;meter.firstChild.style.width=pct+'%';status.textContent=pct<35?'Reading sister’s ego…':pct<70?'Measuring vanmam levels…':'Scanning brother’s record…';if(pct>=100){clearInterval(holdTimer);holdTimer=null;active=false;sound('win');pad.style.background='#e4f8e9';pad.querySelector('#finger').textContent='✅';pad.querySelector('#fingertext').textContent='SCAN COMPLETE';status.innerHTML='<b>Sister recording: BEYOND THE LIMIT 📈🔥<br>Brother recording: ZERO 😇</b>';setTimeout(()=>finalEgoPage(),900)}},100)};const end=()=>{if(active&&pct<100){clearInterval(holdTimer);holdTimer=null;active=false;pct=0;meter.firstChild.style.width='0%';status.textContent='Fingerprint lost! Hold still and try again 😂';pad.style.background='#fff4fb'}};pad.addEventListener('pointerdown',begin);pad.addEventListener('pointerup',end);pad.addEventListener('pointerleave',end);pad.addEventListener('contextmenu',e=>e.preventDefault())}
function finalEgoPage(){clearInterval(holdTimer);counter.textContent='ANALYSIS COMPLETE';progress.style.width='100%';const page=document.createElement('div');page.className='final-screen';page.innerHTML='<div class="final-inner"><div class="emoji">🫆⚡</div><div class="eyebrow" style="color:#ffb4e0">FINGERPRINT ANALYSIS COMPLETE</div><h1 class="question" style="font-size:clamp(34px,9vw,58px)">SISTER’S VANMAM</h1><div class="infinity" id="infinityCount">1</div><p style="font-size:clamp(20px,5vw,28px);font-weight:900">📈 BEYOND THE LIMIT 🔥</p><div id="blastMessage" class="hidden" style="font-size:clamp(28px,8vw,48px);font-weight:1000;margin:24px 0">💥 BLAST! 💥<br>BROTHER HAS ZERO 😇</div><button class="btn primary" id="finalContinue">REVEAL FINAL REPORT ➜</button></div>';document.body.append(page);let n=1;const num=page.querySelector('#infinityCount');const timer=setInterval(()=>{n=Math.min(n+Math.max(1,Math.floor(n*.22)),999999999);num.textContent=n.toLocaleString('en-IN');if(n>=999999999){num.textContent='∞';clearInterval(timer)}},70);setTimeout(()=>{clearInterval(timer);num.textContent='∞';page.classList.add('blast-screen');sound('blast');page.querySelector('#blastMessage').classList.remove('hidden');num.textContent='∞'},4500);page.querySelector('#finalContinue').onclick=()=>{page.remove();result()}}
function result(){clearInterval(holdTimer);counter.textContent='ANALYSIS COMPLETE';progress.style.width='100%';card.innerHTML=`<div class="center"><div class="emoji">🏆💗😂</div><div class="eyebrow">Official sibling laboratory report</div><h1 class="question">FINAL RESULT!</h1><div class="answer-result" style="font-size:clamp(30px,8vw,46px)">YOUR BROTHER HAS MORE PAASAM! 💖🫶</div><div class="answer-result" style="font-size:clamp(25px,7vw,38px);margin-top:14px">SISTER’S VANMAM: ∞ 📈🔥<br>BROTHER: ZERO 😇</div><p class="sub" style="margin-top:25px">Not blood-related, not met in person yet… still family by choice. One day, this long-distance duo will finally meet. 🫂</p><button class="btn primary" id="again">MAKE ME PLAY AGAIN 🔁</button><p class="tiny" style="margin-top:18px">This analysis is 100% fake science and 200% sibling love. 😂</p></div>`;document.getElementById('again').onclick=()=>{q=0;layout()}}

layout();
</script></body></html>
